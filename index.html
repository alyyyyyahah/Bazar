<!doctype html>

<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar</title>
<style>
:root{
--bg:#f3f5fb;--card:#fff;--ink:#18213b;--mut:#68738d;
--pri:#2563eb;--pri2:#1d4ed8;--bd:#dce3f1;--err:#e11d48;--soft:#eaf0ff;
--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 14px;box-shadow:0 4px 20px #1625540c}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;color:var(--pri);font-size:24px;cursor:pointer;letter-spacing:-.5px}
nav{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:3px}
nav button{white-space:nowrap}
button,.btn{background:var(--pri);color:white;border:0;border-radius:12px;padding:10px 15px;font:inherit;font-weight:650;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;box-shadow:0 4px 12px #16255412}
button:hover,.btn:hover{background:var(--pri2);transform:translateY(-2px);box-shadow:0 7px 18px #16255420}
button:active{transform:scale(.97)}
button.sec{background:var(--soft);color:var(--ink);box-shadow:none}
button.sec.on{background:var(--pri);color:white}
button.red{background:var(--err);color:#fff}
button:disabled{opacity:.6;cursor:wait;transform:none}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:var(--card);color:var(--ink);transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
input[type=checkbox],input[type=radio]{width:auto}
input[type=color]{height:45px;padding:4px}
textarea{min-height:80px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
main{max-width:1180px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 25px #1625540c;transition:transform .22s,box-shadow .22s}
.card.p{cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft);display:block}
.card .b{padding:13px}
.card.p:hover{transform:translateY(-5px);box-shadow:0 15px 30px #16255420}
.price{font-weight:800;color:var(--pri);font-size:1.05em}
.mut{color:var(--mut);font-size:14px}
.box{padding:17px;margin-bottom:13px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal>div{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;animation:bazarShow .25s ease}
.modal img.big{width:100%;max-height:300px;object-fit:contain;background:var(--soft);border-radius:12px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--pri) 13%,white);color:var(--pri);font-size:13px}
.tag.w{background:#fef3c7;color:#92400e}
.tag.r{background:#fee2e2;color:#b91c1c}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 17px;border-radius:12px;display:none;z-index:20;max-width:90%;box-shadow:0 12px 30px #0003}
.badge{background:var(--err);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.hero{padding:25px;border-radius:22px;background:linear-gradient(125deg,var(--pri),#6d28d9,#ec4899);color:white;margin-bottom:18px;overflow:hidden;position:relative}
.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.12;margin:0 0 10px}
.hero p{max-width:570px}
.hero .hero-btn{background:#ffe329;color:#18213b}
.section-title{font-size:21px;font-weight:850;margin:22px 0 12px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-choice{display:flex;align-items:center;gap:9px;background:var(--card);color:var(--ink);border:1px solid var(--bd);padding:10px;border-radius:12px;box-shadow:none}
.theme-choice.selected{border:2px solid var(--pri)}
.swatch{width:25px;height:25px;border-radius:50%;flex-shrink:0}
.preview-card{background:var(--soft);padding:15px;border-radius:15px;margin:14px 0}
#app{animation:bazarShow .25s ease}
@keyframes bazarShow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
body.no-animations *,body.no-animations *:before,body.no-animations *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
body.dark-mode{color-scheme:dark}
@media(max-width:600px){
 main{padding:12px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card .b{padding:9px}
 .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero{padding:19px}
 nav{padding-bottom:4px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

<main id="app"></main>
<div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://riywyltnydygazlyrvvh.supabase.co';
const SUPABASE_KEY='sb_publishable_TuDkVcA-mywcPdwLjDsyNg_knCS2RbA';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null,profile=null,view='home',query='',newOrders=0;

/* DIZAÝN SAZLAMALARY */
const themes={
 blue:{name:'Gök',pri:'#2563eb',pri2:'#1d4ed8',bg:'#f3f5fb'},
 purple:{name:'Melewşe',pri:'#7c3aed',pri2:'#6d28d9',bg:'#f7f4ff'},
 pink:{name:'Gülgüne',pri:'#db2777',pri2:'#be185d',bg:'#fff4f8'},
 green:{name:'Ýaşyl',pri:'#059669',pri2:'#047857',bg:'#f0fdf7'},
 orange:{name:'Mämişi',pri:'#ea580c',pri2:'#c2410c',bg:'#fff7ed'},
 teal:{name:'Turkuaz',pri:'#0f9f9a',pri2:'#0f766e',bg:'#effcfb'}
};
const buttonColors=['#2563eb','#7c3aed','#db2777','#f43f5e','#ea580c','#eab308','#059669','#0891b2','#475569','#111827'];
function getPrefs(){
 try{return {...{theme:'blue',buttonColor:null,dark:false,animations:true},...JSON.parse(localStorage.getItem('bazarSettings')||'{}')}}
 catch(e){return {theme:'blue',buttonColor:null,dark:false,animations:true}}
}
function applyPrefs(){
 const p=getPrefs(),t=themes[p.theme]||themes.blue,r=document.documentElement;
 r.style.setProperty('--bg',p.dark?'#101827':t.bg);
 r.style.setProperty('--card',p.dark?'#182235':'#ffffff');
 r.style.setProperty('--ink',p.dark?'#f1f5f9':'#18213b');
 r.style.setProperty('--mut',p.dark?'#a7b3c8':'#68738d');
 r.style.setProperty('--bd',p.dark?'#344158':'#dce3f1');
 r.style.setProperty('--pri',p.buttonColor||t.pri);
 r.style.setProperty('--pri2',p.buttonColor||t.pri2);
 r.style.setProperty('--soft',p.dark?'#26344b':(p.dark?'#26344b':'#eaf0ff'));
 document.body.classList.toggle('dark-mode',!!p.dark);
 document.body.classList.toggle('no-animations',!p.animations);
}
function savePrefs(p){localStorage.setItem('bazarSettings',JSON.stringify(p));applyPrefs()}
function chooseTheme(k){let p=getPrefs();p.theme=k;p.buttonColor=null;savePrefs(p);viewSettings($('#app'))}
function chooseButton(c){let p=getPrefs();p.buttonColor=c;savePrefs(p);viewSettings($('#app'))}
function chooseDark(v){let p=getPrefs();p.dark=v;savePrefs(p);viewSettings($('#app'))}
function chooseAnimations(v){let p=getPrefs();p.animations=v;savePrefs(p)}
function resetPrefs(){localStorage.removeItem('bazarSettings');applyPrefs();viewSettings($('#app'));toast('Dizaýn başlangyç ýagdaýa gaýtaryldy')}

function viewSettings(a){
 const p=getPrefs();
 a.innerHTML=`
 <div class="box" style="max-width:760px;margin:auto">
  <h2 style="margin-top:0">🎨 Dizaýny özüňe sazla</h2>
  <p class="mut">Bazar sahypasynyň reňklerini we görnüşini öz islegiňe görä saýla.</p>
  <div class="section-title">Reňk temasy</div>
  <div class="theme-grid">
  ${Object.entries(themes).map(([k,t])=>`
   <button class="theme-choice ${p.theme===k?'selected':''}" onclick="chooseTheme('${k}')">
    <span class="swatch" style="background:${t.pri}"></span>${t.name}
   </button>`).join('')}
  </div>
  <div class="section-title">Düwmeleriň reňki</div>
  <div class="row" style="gap:12px">
  ${buttonColors.map(c=>`<button aria-label="Reňk ${c}" onclick="chooseButton('${c}')" style="width:36px;height:36px;padding:0;border-radius:50%;background:${c};border:3px solid ${p.buttonColor===c?'var(--ink)':'var(--card)'};box-shadow:0 0 0 1px var(--bd)"></button>`).join('')}
  </div>
  <div class="section-title">Içki fon</div>
  <div class="row">
   <button class="${!p.dark?'':'sec'}" onclick="chooseDark(false)">☀️ Açyk tema</button>
   <button class="${p.dark?'':'sec'}" onclick="chooseDark(true)">🌙 Garaňky tema</button>
  </div>
  <div class="section-title">Animasiýalar</div>
  <label style="display:flex;align-items:center;gap:10px;color:var(--ink)">
   <input type="checkbox" ${p.animations?'checked':''} onchange="chooseAnimations(this.checked)">
   Animasiýalary aç
  </label>
  <div class="preview-card">
   <b>Öňünden synag</b>
   <p class="mut">Saýlan reňkleriň şu ýerde görkezilýär.</p>
   <button onclick="toast('✨ Bazar dizaýny taýýar!')">Mysal düwmesi</button>
   <span class="tag">Bazar</span>
  </div>
  <div class="row">
   <button onclick="resetPrefs()">Başlangyç dizaýna gaýtar</button>
   <button class="sec" onclick="go('home')">Taýýar</button>
  </div>
  <p class="mut" style="margin-top:14px">Sazlamalar şu brauzerde we enjamda saklanýar.</p>
 </div>`;
}
applyPrefs();

/* PROFILI ÝÜKLEMEK */
async function loadProfile(){
 const {data:{session}}=await sb.auth.getSession();
 user=session?.user||null;profile=null;
 if(user){
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
  profile=data;subscribeOrders();
 }
}
let chan=null;
function subscribeOrders(){
 if(chan||!user)return;
 chan=sb.channel('my-orders').on('postgres_changes',
 {event:'INSERT',schema:'public',table:'orders',filter:`seller_id=eq.${user.id}`},
 p=>{newOrders++;toast('🔔 Täze sargyt: '+p.new.product_title);renderNav();if(view==='orders')render()}).subscribe();
}

function renderNav(){
 const b=(v,t,extra='')=>`<button class="sec ${view===v?'on':''}" onclick="go('${v}')">${t}${extra}</button>`;
 let h=b('home','🏠 Baş sahypa');
 if(user){
  h+=b('sell','➕ Satmak');
  h+=b('orders','📦 Sargytlar',newOrders?`<span class="badge">${newOrders}</span>`:'');
  h+=b('profile','👤 Profil');
  h+=b('settings','🎨 Dizaýn');
  if(profile?.is_admin)h+=b('admin','🛡 Admin');
  h+=`<button class="sec" onclick="logout()">Çykmak</button>`;
 }else{
  h+=b('settings','🎨 Dizaýn');
  h+=`<button onclick="go('login')">Girmek / Hasap açmak</button>`;
 }
 $('#nav').innerHTML=h;$('#who').textContent=user?user.email:'';
}
async function logout(){
 await sb.auth.signOut();
 if(chan){sb.removeChannel(chan);chan=null}
 user=profile=null;view='home';render();
}

async function render(){
 renderNav();const a=$('#app');
 if(view==='home')return viewHome(a);
 if(view==='login')return viewLogin(a);
 if(view==='settings')return viewSettings(a);
 if(!user){view='login';return viewLogin(a)}
 if(view==='sell')return viewSell(a);
 if(view==='orders')return viewOrders(a);
 if(view==='profile')return viewProfile(a);
 if(view==='admin')return viewAdmin(a);
}

/* BAŞ SAHYPA WE GÖZLEG */
async function viewHome(a){
 a.innerHTML=`
 <div class="hero">
  <h1>🛒 Bazar</h1>
  <h2>Isleýän harydyňy tap, satyn al ýa-da sat!</h2>
  <p>Harytlary gözle, öz harytlaryňy ýerleşdir we alyjylar bilen habarlaş.</p>
  <button class="hero-btn" onclick="document.querySelector('#q').focus()">Haryt gözle →</button>
 </div>
 <div class="row" style="margin-bottom:14px">
  <input id="q" placeholder="🔍 Haryt, kategoriýa ýa-da şäher gözle..." value="${esc(query)}" style="flex:1;min-width:180px">
  <button onclick="doSearch()">Gözle</button>
 </div>
 <div class="section-title">Täze harytlar</div>
 <div id="list" class="mut">Ýüklenýär...</div>`;
 $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
 let q=sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false}).limit(60);
 if(query){
  const k=query.replace(/[%,()]/g,' ').trim();
  q=q.or(`title.ilike.%${k}%,description.ilike.%${k}%,city.ilike.%${k}%`);
 }
 const {data,error}=await q;
 if(error)return $('#list').textContent='Ýalňyşlyk: '+error.message;
 window._prods=data||[];
 $('#list').className='grid';
 $('#list').innerHTML=window._prods.length?window._prods.map(p=>`
 <div class="card p" onclick="openProduct('${p.id}')">
  <img src="${esc(p.image_url||'')}" alt="" loading="lazy">
  <div class="b"><div><b>${esc(p.title)}</b></div>
   <div class="price">${esc(p.price)} TMT</div>
   <div class="mut">📍 ${esc(p.city||'')}</div>
  </div>
 </div>`).join(''):'<div class="mut">Haryt tapylmady.</div>';
}
function doSearch(){query=$('#q').value;viewHome($('#app'))}

function modal(html){
 closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';
 m.innerHTML=`<div>${html}</div>`;
 m.addEventListener('click',e=>{if(e.target===m)closeModal()});
 document.body.appendChild(m);
}
function closeModal(){$('#modal')?.remove()}

function openProduct(id){
 const p=(window._prods||[]).find(x=>x.id===id);if(!p)return;
 modal(`
  <img class="big" src="${esc(p.image_url||'')}" alt="">
  <h2 style="margin:10px 0 2px">${esc(p.title)}</h2>
  <div class="price" style="font-size:22px">${esc(p.price)} TMT</div>
  <div class="mut">${esc(p.city||'')}</div>
  <p style="white-space:pre-wrap">${esc(p.description||'')}</p>
  ${user?`
   <h3>Sargyt etmek</h3>
   <label>Adyňyz</label><input id="o_name" value="${esc(profile?.full_name||'')}">
   <label>Telefon nomeriňiz</label><input id="o_phone" type="tel" value="${esc(profile?.phone||'')}">
   <label>Şäheriňiz</label><input id="o_city" value="${esc(profile?.city||'')}">
   <label>Adres</label><textarea id="o_addr"></textarea><label>Sany</label><input id="o_qty" type="number" min="1" value="1">

   <div class="row" style="margin-top:14px"><button onclick="placeOrder('${p.id}')">Sargyt ber</button><button class="sec" onclick="closeModal()">Ýap</button></div>
  `:`<button onclick="closeModal();go('login')">Sargyt üçin giriň</button>`}
 `);
}
async function placeOrder(id){
 const v=k=>$('#'+k).value.trim();
 if(!v('o_name')||!v('o_phone')||!v('o_city')||!v('o_addr'))return toast('Ähli meýdanlary dolduryň');
 const qty=parseInt(v('o_qty'));
 if(!Number.isInteger(qty)||qty<1)return toast('Sany dogry giriziň');
 const {error}=await sb.rpc('place_order',{p_product:id,p_name:v('o_name'),p_phone:v('o_phone'),p_city:v('o_city'),p_address:v('o_addr'),p_qty:qty});
 if(error)return toast('Ýalňyşlyk: '+error.message);
 closeModal();toast('✅ Sargydyňyz satyja ugradyldy');
}/* GIRIŞ WE HASAP AÇMAK */
function viewLogin(a){
a.innerHTML=`<div class="box" style="max-width:440px;margin:auto">

  <h2>👋 Bazar-a hoş geldiňiz!</h2>
  <button style="width:100%" onclick="googleLogin()">Google bilen girmek</button>
  <p class="mut" style="text-align:center">ýa-da Gmail arkaly</p>
  <label>Gmail adresiňiz</label><input id="em" type="email" placeholder="ady@gmail.com">
  <label>Parol</label><input id="pw" type="password" placeholder="Iň az 6 simwol">
  <div class="row" style="margin-top:14px">
   <button onclick="emailAuth('in')">Girmek</button>
   <button class="sec" onclick="emailAuth('up')">Hasap açmak</button>
  </div>
 </div>`;
}
async function googleLogin(){
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error)toast(error.message);
}
async function emailAuth(kind){
 const email=$('#em').value.trim().toLowerCase(),password=$('#pw').value;
 if(!/^[^@\s]+@gmail\.com$/.test(email))return toast('Diňe Gmail adresi ulanyň');
 if(password.length<6)return toast('Parol iň az 6 simwol bolmaly');
 if(kind==='up'){
  const {data,error}=await sb.auth.signUp({email,password});
  if(error)return toast(error.message);
  if(!data.session)return toast('📧 Gmail poçtaňyza gelen hatdaky salgyny açyp hasaby tassyklaň, soň giriň');
 }else{
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)return toast('Email ýa-da parol nädogry');
 }
 await loadProfile();go('home');
}/* PROFIL */
function viewProfile(a){
a.innerHTML=`<div class="box" style="max-width:500px">

  <h2>👤 Profil</h2>
  <label>Ady</label><input id="p_name" value="${esc(profile?.full_name||'')}">
  <label>Telefon</label><input id="p_phone" type="tel" value="${esc(profile?.phone||'')}">
  <label>Şäher</label><input id="p_city" value="${esc(profile?.city||'')}">
  <button style="margin-top:14px" onclick="saveProfile()">Ýatda sakla</button>

}
async function saveProfile(){

 }).eq('id',user.id);

}/* SATMAK WE HARYT GOŞMAK /
async function viewSell(a){
if(!isSeller()){
const {data:reqs}=await sb.from('sub_requests').select('').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1);
const pending=reqs?.[0]?.status==='pending';
a.innerHTML=`<div class="box">

   <h2>🛍️ Satyjy bolmak</h2>

   <p>Töleg maglumatyny iberiň. Admin barlap, hasabyňyzy 30 gün açar.</p>
   ${pending?'<span class="tag w">Haýyşyňyz barlanylýar...</span>':`
   <label>Töleg barada maglumat</label><textarea id="sr_note" placeholder="Tölegçiniň ady, çek belgisi ýa-da telefon"></textarea>
   <button style="margin-top:10px" onclick="sendSubReq()">Töledim, tassyklaň</button>`}
  </div>`;
  return;
 }
 a.innerHTML=`
 <div class="box"><span class="tag">Satyjy hasaby ${new Date(profile.seller_until).toLocaleDateString('tk-TM')} çenli açyk</span></div>
 <div class="box"><h2>Täze haryt goş</h2>
  <label>Ady</label><input id="n_title">
  <label>Bahasy (TMT)</label><input id="n_price" type="number" min="0" step="0.01">
  <label>Şäher</label><input id="n_city" value="${esc(profile?.city||'')}">
  <label>Maglumat</label><textarea id="n_desc"></textarea>
  <label>Surat</label><input id="n_img" type="file" accept="image/*">
  <button style="margin-top:12px" id="n_btn" onclick="addProduct()">Haryt goş</button>
 </div>
 <h2>Meniň harytlarym</h2><div id="mine" class="grid mut">Ýüklenýär...</div>`;
 const {data,error}=await sb.from('products').select('*').eq('seller_id',user.id).order('created_at',{ascending:false});
 if(error)return $('#mine').textContent=error.message;
 $('#mine').className='grid';
 $('#mine').innerHTML=data?.length?data.map(p=>`
 <div class="card"><img src="${esc(p.image_url||'')}" alt=""><div class="b">
  <b>${esc(p.title)}</b><div class="price">${esc(p.price)} TMT</div>
  <button class="red" style="margin-top:7px" onclick="delProduct('${p.id}')">Poz</button>
 </div></div>`).join(''):'<div class="mut">Heniz haryt ýok.</div>';
